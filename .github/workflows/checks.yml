name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: figma/actions-checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: figma/actions-setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Test release tooling
        if: github.repository == 'figma/expressive-components-private'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npm ci
      - run: npm run check
      - run: npm run build:examples
      - run: npm pack --dry-run
